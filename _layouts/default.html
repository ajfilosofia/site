<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.resumo | default: site.description | strip_html | escape }}">
<link rel="stylesheet" href="{{ '/css/estilo.css' | relative_url }}">
<link rel="stylesheet" href="{{ '/css/blog.css' | relative_url }}">
{% feed_meta %}
</head>
<body>

<header class="cab">
  <a class="cab-nome" href="{{ '/' | relative_url }}">Andrews Jobim</a>
  <nav aria-label="Principal">
    <ul class="links">
      <li><a href="{{ '/#sobre' | relative_url }}">Sobre</a></li>
      <li><a href="{{ '/#publicacoes' | relative_url }}">Publicações</a></li>
      <li><a href="{{ '/#links' | relative_url }}">Links</a></li>
      <li><a href="{{ '/blog/' | relative_url }}" aria-current="page">Blog</a></li>
      <li><a href="{{ '/#contato' | relative_url }}">Contato</a></li>
    </ul>
  </nav>
</header>

<main>
{{ content }}
</main>

<footer>© {{ site.time | date: "%Y" }} Andrews Jobim</footer>

<button class="topo" type="button" aria-label="Voltar ao topo">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true"><path d="M12 20V5M5 12l7-7 7 7"/></svg>
</button>
<script src="{{ '/js/script.js' | relative_url }}" defer></script>

</body>
</html>
