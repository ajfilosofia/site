---
layout: default
---
<article class="post">
  <a class="voltar" href="{{ '/blog/' | relative_url }}">← Voltar ao blog</a>
  <h1>{{ page.title }}</h1>
  <time class="data" datetime="{{ page.date | date_to_xmlschema }}">{% include data.html d=page.date %}</time>
  <div class="corpo">
    {{ content }}
  </div>
</article>
